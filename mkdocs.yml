site_name: AVCore
site_description: 极简内核——AI 数字人角色模型生成、迭代与微调、出片
site_author: AVCore Team

repo_name: growdu/avcore
repo_url: https://github.com/growdu/avcore
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

use_directory_urls: true
strict: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: zh

nav:
  - 首页: README.md
  - 设计: design.md
  - 架构: architecture.md
  - 存储: storage.md
  - CLI: cli.md
  - 子模块:
      - 模块索引: modules/README.md
      - 人物角色模型生成: modules/persona-modeling.md
      - 人物角色模型迭代与微调: modules/persona-iteration.md
      - 视频生成: modules/video-generation.md
      - 工作流编排: modules/pipeline.md
  - Provider: api/README.md
