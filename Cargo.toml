[package]
name = "avc"
version = "0.1.0"
edition = "2021"
description = "AI Video Core — minimalist persona & video generation framework"
license = "Apache-2.0"

[[bin]]
name = "avc"
path = "src/main.rs"

[lib]
name = "avc"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "wrap_help"] }

# 异步运行时
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "sync"] }

# SQLite（bundled：免系统 libsqlite3）
rusqlite = { version = "0.31", features = ["bundled", "blob"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
anyhow = "1"
thiserror = "1"

# HTTP（Provider 调用）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 配置 / 路径
toml = "0.8"
dirs = "5"

# 时间戳
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# ID 生成
ulid = { version = "1", features = ["serde"] }

# 异步 trait
async-trait = "0.1"

# Shell 输入
rustyline = "14"

# SHA256
sha2 = "0.10"
hex = "0.4"

# base64（BLOB 序列化）
base64 = "0.22"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
